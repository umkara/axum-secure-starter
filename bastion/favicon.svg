<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Bastion">
  <title>Bastion</title>
  <!-- A bastion: a crenellated wall over an arched gateway. Two shapes, no
       thin strokes, so it survives being drawn 16px wide in a tab. The gate is
       punched out with evenodd rather than painted over, so the mark works on
       any background. -->
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c2703f"/>
      <stop offset="1" stop-color="#8a3f21"/>
    </linearGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#b)"/>
  <path fill="#fff" fill-rule="evenodd"
        d="M4 6h5v3h4.5V6h5v3H23V6h5v20H4Z
           M12.5 26v-7.5a3.5 3.5 0 0 1 7 0V26Z"/>
</svg>

name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Advisories land against dependencies that have not changed, so the audit
    # has to run on a clock rather than only on commits.
    - cron: "0 6 * * 1"

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Format, lint, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Test
        # Every backend compiled, but only SQLite reachable — `tests/backends.rs`
        # skips a store whose url is unset. The `backends` job below is where
        # the other three actually run.
        run: cargo test --all-features

  backends:
    name: Storage backend conformance
    runs-on: ubuntu-latest

    # Without these, `tests/backends.rs` skips three of the four backends and
    # reports success, which is the failure mode the suite exists to prevent:
    # a contract that only SQLite is held to is a contract SQLite defines.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: bastion
          POSTGRES_PASSWORD: bastion
          POSTGRES_DB: bastion_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bastion"
          --health-interval 10s --health-timeout 5s --health-retries 5

      mysql:
        # 8.4, not 8.0: the schema needs `utf8mb4_0900_as_cs`, which arrived in
        # 8.0.1, and pinning the current LTS keeps that requirement honest.
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bastion_test
          MYSQL_USER: bastion
          MYSQL_PASSWORD: bastion
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval 10s --health-timeout 5s --health-retries 10

      mongodb:
        image: mongo:8
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ ping: 1 })'"
          --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Conformance suite, every backend
        env:
          APP_TEST_POSTGRES_URL: postgres://bastion:bastion@127.0.0.1:5432/bastion_test
          APP_TEST_MYSQL_URL: mysql://bastion:bastion@127.0.0.1:3306/bastion_test
          APP_TEST_MONGODB_URL: mongodb://127.0.0.1:27017/bastion_test
        run: cargo test --features all-backends --test backends

      # Last, and in its own step: it truncates the PostgreSQL database, which
      # would pull the rug from the suite above if the two ran together.
      - name: SQLite to PostgreSQL migration
        env:
          APP_TEST_POSTGRES_URL: postgres://bastion:bastion@127.0.0.1:5432/bastion_test
        run: cargo test --features postgres --test migrate_store

  feature-builds:
    name: Each backend builds on its own
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [sqlite, postgres, mysql, mongodb]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # A deployment builds one backend, so one backend has to compile alone.
      # `--all-features` in the `check` job would never catch a module that
      # only compiles because some other backend's imports are also present.
      - name: Build with only ${{ matrix.backend }}
        run: cargo check --all-targets --no-default-features --features ${{ matrix.backend }}

  example-nextjs-blog:
    name: Blog example builds
    runs-on: ubuntu-latest
    # The library-free integration: no auth library, so a break here is a break
    # in the two files that talk to Bastion rather than in somebody else's SDK.
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: examples/nextjs-blog/pnpm-lock.yaml

      - name: Install
        working-directory: examples/nextjs-blog
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: examples/nextjs-blog
        run: pnpm typecheck

      - name: Build
        working-directory: examples/nextjs-blog
        # `seal.ts` throws at import when the secret is missing or the wrong
        # length, so the build needs a valid one — any valid one.
        env:
          BASTION_TOKEN_SECRET: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: pnpm build

  example-nextjs:
    name: Example builds
    runs-on: ubuntu-latest
    # The example is a separate toolchain that nothing else in CI would catch
    # breaking. It builds without a Bastion instance because no Bastion call
    # happens at build time — which is itself worth keeping true.
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: examples/nextjs/pnpm-lock.yaml

      - name: Install
        working-directory: examples/nextjs
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: examples/nextjs
        run: pnpm typecheck

      - name: Build
        working-directory: examples/nextjs
        # Config is parsed at module load and throws when a secret is missing,
        # so the build needs values — any valid ones.
        env:
          BETTER_AUTH_SECRET: build-only-not-a-real-secret-000000000000
          BASTION_TOKEN_SECRET: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: pnpm build

  audit:
    name: Dependency advisories
    runs-on: ubuntu-latest
    # The action writes its findings as a check run, which it only attempts when
    # it has something to report. A job with the default read-only token
    # therefore passes for as long as the audit is clean and fails with
    # "Resource not accessible by integration" on the first advisory — losing
    # the advisory itself behind a permissions error.
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  no-unused-drivers:
    name: The default build carries one driver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # `.cargo/audit.toml` waives RUSTSEC-2023-0071 on the strength of the
      # MySQL driver being absent from the *default* build graph. Since the
      # storage backends landed, `--features mysql` deliberately puts it there —
      # so this job pins the default rather than the crate, and the waiver says
      # what a MySQL build is accepting. If the default ever starts carrying a
      # driver it does not need, the waiver would begin hiding exposure nobody
      # opted into, and that is what fails here.
      - name: Assert the default features compile only the SQLite driver
        run: |
          if cargo tree -e normal | grep -E 'sqlx-(mysql|postgres)'; then
            echo "::error::the default build now carries a driver .cargo/audit.toml assumes is absent; revisit the waiver"
            exit 1
          fi
          echo "confirmed: the default build compiles only the sqlite driver"

      # The other half of the claim: opting in is what pulls the driver, and
      # therefore `rsa`, into the graph. If this stops being true the waiver's
      # scope note is wrong in the other direction and should be rewritten.
      - name: Assert the MySQL feature is what pulls the driver in
        run: |
          if ! cargo tree -e normal --features mysql | grep -q 'sqlx-mysql'; then
            echo "::error::--features mysql no longer compiles sqlx-mysql; .cargo/audit.toml describes a build that does not exist"
            exit 1
          fi
          echo "confirmed: sqlx-mysql, and its rsa dependency, arrive only with the mysql feature"

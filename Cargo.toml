[package]
name = "bastion"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
authors = ["Umit Karasu <umkarasu@gmail.com>"]
description = "A security-hardened JSON API server in Rust: Argon2id credentials, rotating refresh tokens, per-IP and per-account rate limiting, and a bounded request/connection surface."
license = "MIT"
readme = "README.md"
repository = "https://github.com/umkara/bastion"
homepage = "https://bastionrs.dev"
keywords = ["axum", "api", "authentication", "jwt", "security"]
categories = ["web-programming::http-server", "authentication"]
# There is a second binary, so `cargo run` would otherwise refuse as ambiguous
# whenever both drivers are compiled in — and every "getting started" command in
# the README is a bare `cargo run`.
default-run = "bastion"

# Storage backends are compiled in, not loaded. Each one drags in a driver, a
# connection stack and — for MongoDB — a second TLS surface, so a deployment
# should carry only the one it runs. `Backend::from_url` refuses at start-up
# when a URL names a backend this binary was not built with, which is a boot
# failure rather than a runtime surprise.
[features]
default = ["sqlite"]
sqlite = ["sqlx/sqlite"]
postgres = ["sqlx/postgres"]
mysql = ["sqlx/mysql"]
mongodb = ["dep:mongodb", "dep:futures-util"]
# For the conformance suite, which wants every backend in one binary.
all-backends = ["sqlite", "postgres", "mysql", "mongodb"]

# Needs both drivers at once, so it is skipped unless both are compiled in.
# `sqlite` is on by default, which makes `--features postgres` enough.
[[bin]]
name = "bastion-migrate-store"
required-features = ["sqlite", "postgres"]

[dependencies]
anyhow = "1.0.104"
argon2 = "0.5.3"
async-trait = "0.1.91"
axum = "0.8"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
base64 = "0.23.0"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
futures-util = { version = "0.3.33", default-features = false, features = ["std"], optional = true }
hex = "0.4.3"
hyper = { version = "1.11.0", default-features = false }
hyper-util = { version = "0.1.20", default-features = false, features = ["tokio"] }
jsonwebtoken = { version = "11.0.0", features = ["aws_lc_rs"] }
# `rustls-tls-aws-lc`, not the default `rustls-tls`: the default pulls ring in
# as a second rustls provider, and `main` installs aws-lc-rs as *the* provider.
# Two providers in one process is the failure the pin in `main` exists to
# prevent.
mongodb = { version = "3.8.0", default-features = false, features = ["rustls-tls-aws-lc", "dns-resolver", "compat-3-3-0", "bson-3"], optional = true }
pasetors = { version = "0.7.7", default-features = false, features = ["std", "v4"] }
rand = { version = "0.10.2", features = ["std", "std_rng"] }
rustls = { version = "0.23.42", default-features = false, features = ["aws-lc-rs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
# The driver features (`sqlite`, `postgres`, `mysql`) are turned on by this
# crate's own features, not here, so that a build carries one driver.
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-aws-lc-rs", "macros", "migrate", "uuid", "chrono"] }
subtle = "2.6.1"
thiserror = "2.0.19"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5.3", features = ["util", "limit", "timeout", "load-shed", "buffer"] }
tower-http = { version = "0.7.0", features = ["trace", "compression-gzip", "cors", "limit", "timeout", "request-id", "sensitive-headers", "catch-panic", "normalize-path", "set-header", "fs"] }
tower_governor = "0.8.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }
validator = { version = "0.20.0", features = ["derive"] }

[dev-dependencies]
base64 = "0.23.0"
chrono = "0.4.45"
futures-util = { version = "0.3.33", default-features = false, features = ["std"] }
jsonwebtoken = "11.0.0"
# Tests talk plain HTTP to a loopback listener, so no TLS backend is needed.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
tempfile = "3.27.0"
uuid = "1.24.0"

[profile.release]
# Cross-crate inlining and a single codegen unit; worth the longer build for a
# long-running server.
lto = "thin"
codegen-units = 1
strip = "symbols"
# `panic = "abort"` is deliberately NOT set: the catch-panic middleware needs
# unwinding to turn a panicking handler into a 500 instead of killing the
# process.
panic = "unwind"
